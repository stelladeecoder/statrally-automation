name: NFL private artifact access test
on:
  push:
    branches: ['test/nfl-private-artifact-access']
    paths: ['.github/workflows/nfl-private-artifact-access-test.yml']
permissions: {}
jobs:
  read-synthetic-nfl-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.STATRALLY_MODELS_READ_TOKEN }}
          repository: stelladeecoder/statrally-even-odd-models
          run-id: '43944902696'
          name: nfl-artifact-access-fixture
          path: fixture
      - name: Verify exact nonpublishing sample
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "schema": "nfl-artifact-access-fixture-v1",
              "sport": "NFL",
              "synthetic": True,
              "publishable": False,
              "shadow_mode": True,
              "orders_placed": 0,
          }
          actual = json.loads(Path("fixture/nfl-artifact-access-fixture.json").read_text())
          if actual != expected or type(actual.get("orders_placed")) is not int:
              raise SystemExit("Unexpected NFL artifact")
          print("Verified nonpublishing private NFL artifact")
          PY
