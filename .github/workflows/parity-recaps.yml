name: StatRally Even/Odd Discord recaps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/parity-recaps.yml"
      - "src/parity_recaps.py"
      - "src/parity_calendar.py"
      - "src/parity_model_performance.py"
      - "tests/test_parity_recaps.py"
  schedule:
    # Cover 8:15 PM Central in standard and daylight time (UTC next day).
    - cron: "15,45 1,2 * * *"
permissions:
  contents: read
  issues: write
concurrency:
  group: statrally-evenodd-recaps
  cancel-in-progress: false
jobs:
  recaps:
    if: vars.STATRALLY_PARITY_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG calendar renderer
        run: python -m pip install "Pillow>=10,<13"
      - name: Verify recap formatting and scoring
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_parity_recaps.py -v
      - name: Post individual Even/Odd results
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          SOCCER_RESULTS_HOOK: ${{ secrets.STATRALLY_SOCCER_RESULTS_WEBHOOK || secrets.STATRALLY_RESULTS_DISCORD_WEBHOOK }}
          RESULT_TEST: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Enable individual results and verify both Discord routes' }}
        run: |
          if [ "$RESULT_TEST" = true ]; then
            python src/parity_individual_results.py --test
          else
            python src/parity_individual_results.py
          fi
      - name: Refresh private Even/Odd model performance
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          STATRALLY_MODEL_PERFORMANCE_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_MODEL_PERFORMANCE_DISCORD_WEBHOOK }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python - <<'PY' > "$RUNNER_TEMP/model-performance-hour"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("America/Chicago")).hour)
          PY
            if [ "$(cat "$RUNNER_TEMP/model-performance-hour")" != 20 ]; then
              exit 0
            fi
          fi
          python src/parity_model_performance.py
