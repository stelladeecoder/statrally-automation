name: StatRally Even/Odd Discord recaps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/parity-recaps.yml"
      - "src/parity_recaps.py"
      - "src/parity_model_performance.py"
      - "tests/test_parity_recaps.py"
  schedule:
    # Cover 8:15 AM Central in standard and daylight time.
    - cron: "15 13,14 * * *"
permissions:
  contents: read
  issues: write
concurrency:
  group: statrally-evenodd-recaps
  cancel-in-progress: false
jobs:
  recaps:
    if: vars.STATRALLY_PARITY_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify recap formatting and scoring
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_parity_recaps.py -v
      - name: Grade archived picks and publish Discord recaps
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          STATRALLY_DAILY_RESULTS_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_DAILY_RESULTS_DISCORD_WEBHOOK }}
          STATRALLY_WEEKLY_RECAP_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_WEEKLY_RECAP_DISCORD_WEBHOOK }}
          STATRALLY_MONTHLY_RECAP_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_MONTHLY_RECAP_DISCORD_WEBHOOK }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python - <<'PY' > "$RUNNER_TEMP/recap-hour"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("America/Chicago")).hour)
          PY
            if [ "$(cat "$RUNNER_TEMP/recap-hour")" -lt 8 ]; then
              exit 0
            fi
          fi
          python src/parity_recaps.py
      - name: Post individual Even/Odd results
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          SOCCER_RESULTS_HOOK: ${{ secrets.STATRALLY_SOCCER_RESULTS_WEBHOOK || secrets.STATRALLY_RESULTS_DISCORD_WEBHOOK }}
          NHL_RESULTS_HOOK: ${{ secrets.STATRALLY_NHL_RESULTS_WEBHOOK }}
          RESULT_TEST: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Enable individual results and verify both Discord routes' }}
        run: |
          if [ "$RESULT_TEST" = true ]; then
            python src/parity_individual_results.py --test
          else
            python src/parity_individual_results.py
          fi
      - name: Refresh private Even/Odd model performance
        if: ${{ !cancelled() }}
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_TEST: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Send requested private model performance test' }}
          STATRALLY_MODEL_PERFORMANCE_DISCORD_WEBHOOK: ${{ secrets.STATRALLY_MODEL_PERFORMANCE_DISCORD_WEBHOOK }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python - <<'PY' > "$RUNNER_TEMP/model-performance-hour"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo("America/Chicago")).hour)
          PY
            if [ "$(cat "$RUNNER_TEMP/model-performance-hour")" -lt 8 ]; then
              exit 0
            fi
          fi
          if [ "$PERFORMANCE_TEST" = true ]; then
            python - <<'PY'
          import os
          from datetime import date
          from parity_model_performance import report
          from parity_recaps import deliver, history

          repo = os.environ["GITHUB_REPOSITORY"]
          day = date(2026, 11, 14)
          rows = []
          for sport, probability, outcomes in [
              ("soccer", .53, ("ODD", "EVEN", "ODD")),
              ("hockey", .725, ("ODD", "ODD", "EVEN", "ODD")),
          ]:
              for actual in outcomes:
                  rows.append({
                      "day": day, "sport": sport, "starred": probability >= .70,
                      "correct": actual == "ODD", "outcome": {"actual": actual},
                      "forecast": {"prediction": "ODD", "p_odd": probability,
                                   "p_even": 1 - probability, "model": "sample"},
                  })
          message = report(rows, day)
          for embed in message["embeds"]:
              embed["title"] = "TEST POST · " + embed["title"]
              embed["description"] = "*Illustrative data*\n\n" + embed["description"]
          issues = list(history(repo, "/issues?state=all"))
          deliver(repo, issues, "StatRally model performance test | " + os.environ["GITHUB_RUN_ID"],
                  os.environ["STATRALLY_MODEL_PERFORMANCE_DISCORD_WEBHOOK"], message)
          PY
          else
            python src/parity_model_performance.py
          fi
