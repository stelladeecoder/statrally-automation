name: NFL ATD morning paper watchlist
on:
  pull_request:
    paths:
      - ".github/workflows/nfl-atd-morning-paper-watchlist.yml"
      - "src/nfl_atd_morning_watchlist.py"
      - "tests/test_nfl_atd_morning_watchlist.py"
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nfl-atd-morning-paper-watchlist
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run NFL ATD watchlist smoke tests
        run: python -m unittest discover -s tests -p "test_nfl_atd_morning_watchlist.py" -v
      - name: Load verified NFL ATD slate and post to NFL picks
        if: github.ref == "refs/heads/main"
        env:
          GH_TOKEN: ${{ secrets.STATRALLY_MODELS_READ_TOKEN }}
          STATRALLY_NFL_LEDGER_TOKEN: ${{ secrets.STATRALLY_NFL_LEDGER_TOKEN }}
          STATRALLY_NFL_PICKS_WEBHOOK: ${{ secrets.STATRALLY_NFL_PICKS_WEBHOOK }}
          STATRALLY_NFL_PAPER_ONLY: "true"
        run: |
          set -euo pipefail
          repo=stelladeecoder/statrally-even-odd-models
          run_id=$(gh run list --repo "$repo" --workflow nfl-atd-t90-shadow.yml \
            --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run download "$run_id" --repo "$repo" \
            --name "nfl-atd-shadow-$run_id" --dir "$RUNNER_TEMP/nfl-atd"
          report=$(find "$RUNNER_TEMP/nfl-atd" -type f \
            \( -name "nfl_atd_shadow_full.json" -o -name "nfl_atd_shadow_snapshot.json" \) \
            -print -quit)
          [[ -n "$report" ]]
          python src/nfl_atd_morning_watchlist.py "$report"
