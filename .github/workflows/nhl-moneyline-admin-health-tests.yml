name: NHL moneyline admin private health audit tests
on:
  pull_request:
    paths:
      - src/nhl_moneyline_admin_health.py
      - src/m18_admin_monitor.py
      - tests/test_nhl_moneyline_admin_health.py
      - .github/workflows/m18-admin-monitor.yml
      - .github/workflows/nhl-moneyline-admin-health-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-health-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private NHL snapshots appear in existing admin report without credentials
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_nhl_moneyline_admin_health.py -v
          python -m unittest discover -s tests -p test_m18_admin_monitor.py -v
