name: NHL Kalshi moneyline Discord route contract tests
on:
  pull_request:
    paths:
      - src/nhl_moneyline_paper_discord.py
      - tests/test_nhl_moneyline_paper_discord.py
      - .github/workflows/nhl-moneyline-paper-routing-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline three-channel and report guardrail tests
        run: python -m unittest discover -s tests -p test_nhl_moneyline_paper_discord.py -v
