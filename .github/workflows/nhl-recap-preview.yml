name: NHL synthetic PAPER recap preview
on:
  pull_request:
    paths:
      - src/nhl_paper_recap_scheduler.py
      - scripts/nhl_recap_preview.py
      - .github/workflows/nhl-recap-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/nhl_recap_preview.py
        env:
          PYTHONPATH: src
  preview:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/nhl_recap_preview.py
        env:
          PYTHONPATH: src
          RECAP_TEST_SEND: "true"
          STATRALLY_NHL_DAILY_RECAP_WEBHOOK: ${{ secrets.STATRALLY_DAILY_RESULTS_DISCORD_WEBHOOK }}
          STATRALLY_NHL_WEEKLY_RECAP_WEBHOOK: ${{ secrets.STATRALLY_WEEKLY_RECAP_DISCORD_WEBHOOK }}
          STATRALLY_NHL_MONTHLY_RECAP_WEBHOOK: ${{ secrets.STATRALLY_MONTHLY_RECAP_DISCORD_WEBHOOK }}
