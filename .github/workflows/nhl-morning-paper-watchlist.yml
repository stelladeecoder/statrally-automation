name: NHL morning paper watchlist
on:
  pull_request:
    paths:
      - '.github/workflows/nhl-morning-paper-watchlist.yml'
      - 'src/nhl_morning_watchlist.py'
      - 'tests/test_nhl_morning_watchlist.py'
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nhl-morning-paper-watchlist
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_nhl_morning_watchlist.py -v
      - name: Central schedule guard
        id: clock
        run: echo "due=$(if [[ $(TZ=America/Chicago date +%H) == 06 ]]; then echo true; else echo false; fi)" >> "$GITHUB_OUTPUT"
      - name: Load verified slate and post to NHL watchlist
        if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.clock.outputs.due == 'true')
        env:
          GH_TOKEN: ${{ secrets.STATRALLY_NHL_LEDGER_TOKEN }}
          STATRALLY_NHL_LEDGER_TOKEN: ${{ secrets.STATRALLY_NHL_LEDGER_TOKEN }}
          STATRALLY_NHL_WATCHLIST_WEBHOOK: ${{ secrets.STATRALLY_NHL_WATCHLIST_WEBHOOK }}
          STATRALLY_NHL_PAPER_ONLY: 'true'
        run: |
          repo=stelladeecoder/statrally-even-odd-models
          run_id=$(gh run list --repo "$repo" --workflow nhl-morning-paper-watchlist-source.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run download "$run_id" --repo "$repo" --name nhl-morning-paper-watchlist --dir "$RUNNER_TEMP/nhl-morning"
          python src/nhl_morning_watchlist.py "$RUNNER_TEMP/nhl-morning/nhl-morning-watchlist.json"
