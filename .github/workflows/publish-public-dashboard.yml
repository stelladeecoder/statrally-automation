name: Publish read-only StatRally dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "StatRally soccer + NHL Even Odd research beta"
      - "StatRally Even Odd verified forward results"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "config/prediction_selection_policy.json"
      - "discord-app/prediction-quality.mjs"
      - "discord-app/platform*"
      - "scripts/build_public_dashboard.py"
      - "src/parity_public_snapshot.py"
      - "discord-app/parity*"
      - ".github/workflows/publish-public-dashboard.yml"
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: statrally-public-dashboard
  cancel-in-progress: false
jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_dispatch' || vars.STATRALLY_PUBLIC_DASHBOARD_ENABLED == 'true') &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify public presentation and canonical record handling
        run: node --test discord-app/tests/*.test.mjs
      - name: Build static public consumer of the sanitized export
        run: python3 scripts/build_public_dashboard.py --output "$RUNNER_TEMP/site"
      - name: Build published parity snapshot from frozen prematch records
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/parity_public_snapshot.py --output "$RUNNER_TEMP/site/parity.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy read-only public dashboard
        id: deployment
        uses: actions/deploy-pages@v4
